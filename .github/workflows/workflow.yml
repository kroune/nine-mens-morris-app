name: Test and builds app

on:
  workflow_dispatch:
  push:

permissions:
  contents: write


env:
  repository_name: NineMensMorris

jobs:
  basicTest:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache tooling
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            composeApp/build
            composeApp/.gradle
            baselineprofile/build
          key: ${{ runner.os }}-unit-tests-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-unit-tests-${{ hashFiles('**/libs.versions.toml') }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run basic tests with Gradle
        run: ./gradlew testReleaseUnitTest --rerun

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            composeApp/build
            composeApp/.gradle
            baselineprofile/build
          key: ${{ runner.os }}-unit-tests-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}

  uiTest:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache KMP tooling
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            composeApp/build
            composeApp/.gradle
            baselineprofile/build
          key: ${{ runner.os }}-ui-tests-android-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ui-tests-android--${{ hashFiles('**/libs.versions.toml') }}

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix permissions
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew allDevicesDebugAndroidTest --rerun -x test -x iosSimulatorArm64Test -x desktopTest -x wasmJsTest

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            composeApp/build
            composeApp/.gradle
            baselineprofile/build
          key: ${{ runner.os }}-ui-tests-android-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}

  produceArtifacts:
    needs: [ basicTest, uiTest ]
    runs-on: ubuntu-latest

    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache tooling
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            composeApp/build
            composeApp/.gradle
            baselineprofile/build
          key: ubuntu-latest-produce-artifacts-Android-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-latest-produce-artifactsAndroid-${{ hashFiles('**/libs.versions.toml') }}

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix permissions
        run: chmod +x gradlew

      - name: Create keystore file
        run: |
          touch composeApp/keyStore.jks
          echo $KEYSTORE | base64 -d  > composeApp/keyStore.jks

      - name: Produce artifacts
        run: ./gradlew assembleRelease -x test -x iosSimulatorArm64Test -x connectedAndroidTest

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            composeApp/build
            composeApp/.gradle
            baselineprofile/build
          key: ubuntu-latest-produce-artifacts-Android-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}

      - name: Upload artifacts to github
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.repository_name }}-Android-artifact
          path: composeApp/build/outputs/apk/release/composeApp-release.apk
